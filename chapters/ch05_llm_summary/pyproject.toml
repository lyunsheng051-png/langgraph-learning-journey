[project]
name = "langgraph-journey-ch05"
version = "0.1.0"
description = "LangGraph 学习之路第 5 篇：DeepSeek 文档摘要与结构校验"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph==1.2.16",
    "langchain-core>=1.7,<2",
    "langchain-deepseek>=1,<2",
    "openai>=3.36,<4",
    "pydantic>=2,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chapter_demo"]
